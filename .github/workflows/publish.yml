name: Publish to CurseForge

on:
  workflow_dispatch:
    inputs:
      publish_forge:
        description: 'Publish Forge jar'
        required: true
        type: boolean
        default: true
      publish_neoforge:
        description: 'Publish NeoForge jar'
        required: true
        type: boolean
        default: true
      publish_fabric:
        description: 'Publish Fabric jar'
        required: true
        type: boolean
        default: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Read mod version
        id: mod_version
        run: |
          version=$(grep -E '^mod_version\s*=' gradle.properties | sed -E 's/^mod_version\s*=\s*//' | tr -d ' \r\n')
          if [ -z "$version" ]; then
            echo "::error::Could not read mod_version from gradle.properties"
            exit 1
          fi
          echo "Resolved mod_version=$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build

      - name: Publish Forge to CurseForge
        if: ${{ inputs.publish_forge }}
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          version: ${{ steps.mod_version.outputs.version }}
          version-type: release
          name: "[${{ steps.mod_version.outputs.version }}] AFKStatus"
          changelog-file: CHANGELOG.md
          loaders: forge
          game-versions: 1.21.8
          files: forge/build/libs/!(*-@(dev|dev-shadow|sources|javadoc)).jar
          java: 21

          curseforge-id: 1318335
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

      - name: Publish NeoForge to CurseForge
        if: ${{ inputs.publish_neoforge }}
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          version: ${{ steps.mod_version.outputs.version }}
          version-type: release
          name: "[${{ steps.mod_version.outputs.version }}] AFKStatus"
          changelog-file: CHANGELOG.md
          loaders: neoforge
          game-versions: 1.21.8
          files: neoforge/build/libs/!(*-@(dev|dev-shadow|sources|javadoc)).jar
          java: 21

          curseforge-id: 1318335
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

      - name: Publish Fabric to CurseForge
        if: ${{ inputs.publish_fabric }}
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          version: ${{ steps.mod_version.outputs.version }}
          version-type: release
          name: "[${{ steps.mod_version.outputs.version }}] AFKStatus"
          changelog-file: CHANGELOG.md
          loaders: fabric
          game-versions: 1.21.8
          files: fabric/build/libs/!(*-@(dev|dev-shadow|sources|javadoc)).jar
          java: 21

          curseforge-id: 1318335
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
