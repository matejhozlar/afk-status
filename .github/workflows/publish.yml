name: Publish to CurseForge

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release'
        required: true
        type: string
      publish_forge:
        description: 'Publish Forge jar'
        required: true
        type: boolean
        default: true
      publish_fabric:
        description: 'Publish Fabric jar'
        required: true
        type: boolean
        default: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build

      - name: Publish Forge to CurseForge
        if: ${{ inputs.publish_forge }}
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          version: ${{ inputs.version }}
          version-type: release
          name: "[${{ inputs.version }}] AFKStatus"
          changelog-file: CHANGELOG.md
          loaders: forge
          game-versions: 1.20.1
          files: forge/build/libs/!(*-@(dev|dev-shadow|sources|javadoc)).jar
          java: 17

          curseforge-id: 1318335
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

      - name: Publish Fabric to CurseForge
        if: ${{ inputs.publish_fabric }}
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          version: ${{ inputs.version }}
          version-type: release
          name: "[${{ inputs.version }}] AFKStatus"
          changelog-file: CHANGELOG.md
          loaders: fabric
          game-versions: 1.20.1
          files: fabric/build/libs/!(*-@(dev|dev-shadow|sources|javadoc)).jar
          java: 17

          curseforge-id: 1318335
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
