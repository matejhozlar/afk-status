plugins {
    id 'dev.architectury.loom-no-remap'
    id 'com.gradleup.shadow'
    id 'maven-publish'
}

base {
    archivesName = "$rootProject.archives_name-$project.name"
}

java {
    withSourcesJar()
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
    it.options.encoding = 'UTF-8'
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
}

configurations {
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    minecraft "com.mojang:minecraft:$rootProject.minecraft_version"
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"

    shadowBundle(implementation("com.electronwill.night-config:core:$rootProject.nightconfig_version")) { transitive = false }
    shadowBundle(implementation("com.electronwill.night-config:toml:$rootProject.nightconfig_version")) { transitive = false }
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft_version_range', rootProject.minecraft_version_range
    inputs.property 'neoforge_version', rootProject.neoforge_version
    inputs.property 'neoforge_version_range', rootProject.neoforge_version_range
    inputs.property 'mod_id', rootProject.mod_id
    inputs.property 'mod_name', rootProject.mod_name
    inputs.property 'mod_authors', rootProject.mod_authors
    inputs.property 'mod_license', rootProject.mod_license
    inputs.property 'mod_description', rootProject.mod_description

    filesMatching('META-INF/neoforge.mods.toml') {
        expand(
                version: project.version,
                minecraft_version: rootProject.minecraft_version,
                minecraft_version_range: rootProject.minecraft_version_range,
                neoforge_version: rootProject.neoforge_version,
                neoforge_version_range: rootProject.neoforge_version_range,
                mod_id: rootProject.mod_id,
                mod_name: rootProject.mod_name,
                mod_authors: rootProject.mod_authors,
                mod_license: rootProject.mod_license,
                mod_description: rootProject.mod_description
        )
    }
}

jar {
    archiveClassifier = 'slim'
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = ''
    mergeServiceFiles()

    relocate("com.electronwill", "com.saunhardy.afkstatus.shadow.com.electronwill")
}

assemble.dependsOn shadowJar
